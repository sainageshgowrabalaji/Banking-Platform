# Everything the services need on a laptop.
#
#   docker compose -f infra/docker-compose.yml up -d                      core tools for phase 1
#   docker compose -f infra/docker-compose.yml --profile markets up -d    adds the tools for trading
#   docker compose -f infra/docker-compose.yml down                       stop (add -v to wipe the data)
#
# The passwords below are for a laptop only. Real environments take theirs from a secret store.
name: bank

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank_local_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka 4 runs without ZooKeeper. One node is both broker and controller (KRaft mode).
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Not used by phase 1. It is here for the phase that shares rate limits between gateway copies.
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # Login, tokens, roles. Admin console on http://localhost:8090
  # On first start it loads the "bank" realm from infra/keycloak, with two users for a laptop.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Grafana with Tempo (traces), Loki (logs) and Prometheus (metrics) in one container.
  # Grafana on http://localhost:3000. Services send OpenTelemetry data to port 4318.
  observability:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  # Time-series database for ticks. Console on http://localhost:9000
  questdb:
    image: questdb/questdb:latest
    profiles: [markets]
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - questdb-data:/var/lib/questdb

  # S3-compatible storage for statements and the audit-trail export. Console on http://localhost:9101
  minio:
    image: minio/minio:latest
    profiles: [markets]
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bank_local_only}
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  kafka-data:
  questdb-data:
  minio-data:
