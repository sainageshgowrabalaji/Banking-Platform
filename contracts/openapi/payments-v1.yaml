openapi: 3.1.0
info:
  title: Payments API
  version: 1.0.0
  description: >-
    Send, track and cancel payments. The fields map to ISO 20022 (pain.001 for the request, pacs.008
    between banks, pacs.002 for status). The payments service serves this contract, and its
    integration tests check every response against this file.
servers:
  - url: http://localhost:8080/payments
    description: Through the local gateway
tags:
  - name: Payments
security:
  - bearerAuth: []
paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Send a payment
      description: >-
        Returns 202 because a payment is a saga. Funds are held, the payment is screened, sent on its
        rail and then settled or released. Follow the status with GET or the payment events.
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
          application/xml:
            schema:
              type: string
              description: >-
                An ISO 20022 pain.001.001.09 message with one payment in it. DbtrAcct/Id/Othr/Id is the
                debtor account id, and PmtTpInf/LclInstrm/Prtry is the rail (ACH when left out).
      responses:
        '202':
          description: >-
            The payment was accepted for processing. The status in the body says how far it has come,
            which can already be ACSC or RJCT. Sending the same request again with the same
            Idempotency-Key returns the same payment.
          headers:
            Location:
              description: URL of the payment
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listPayments
      summary: List payments of an account, newest first
      tags: [Payments]
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One page of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '400':
          $ref: '#/components/responses/Problem'
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get one payment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/payments/{paymentId}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment that has not been sent on its rail yet
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The payment was cancelled and the hold was released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/payments/{paymentId}/messages:
    get:
      operationId: listPaymentMessages
      summary: The ISO 20022 messages exchanged with the rail for a payment, oldest first
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMessage'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{8,64}$'
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error in RFC 9457 problem details format
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+([.][0-9]+)?$'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    Rail:
      type: string
      description: BOOK moves money inside the bank. ACH settles in batches. INSTANT settles in seconds.
      enum: [BOOK, ACH, INSTANT]
    PaymentStatus:
      type: string
      description: >-
        ISO 20022 status codes. RCVD received, ACCP accepted after checks, ACSP in process, ACSC settled,
        RJCT rejected, CANC cancelled.
      enum: [RCVD, ACCP, ACSP, ACSC, RJCT, CANC]
    Party:
      type: object
      required: [name, accountNumber]
      properties:
        name:
          type: string
          maxLength: 140
        accountNumber:
          type: string
          maxLength: 64
          description: For BOOK, the id of the receiving account in this bank.
        routingNumber:
          type: string
          pattern: '^[0-9]{9}$'
          description: The receiving bank. Needed for ACH and INSTANT.
    CreatePaymentRequest:
      type: object
      required: [debtorAccountId, creditor, amount, rail]
      properties:
        debtorAccountId:
          type: string
          format: uuid
        creditor:
          $ref: '#/components/schemas/Party'
        amount:
          $ref: '#/components/schemas/Money'
        rail:
          $ref: '#/components/schemas/Rail'
        endToEndId:
          type: string
          maxLength: 35
          description: The sender's own reference. It travels with the payment to the receiver.
        remittanceInformation:
          type: string
          maxLength: 140
    Payment:
      type: object
      required: [id, debtorAccountId, creditor, amount, rail, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditor:
          $ref: '#/components/schemas/Party'
        amount:
          $ref: '#/components/schemas/Money'
        rail:
          $ref: '#/components/schemas/Rail'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reasonCode:
          type: string
          description: >-
            ISO 20022 reason when the status is RJCT or CANC. AC01 wrong account number, AC04 closed
            account, AC06 blocked account, AM02 over the rail's limit, AM04 not enough money, CUST
            cancelled by the customer, MS03 no reason given, RR04 stopped by a regulatory check.
          enum: [AC01, AC04, AC06, AM02, AM04, CUST, MS03, RR04]
        reasonDetail:
          type: string
        endToEndId:
          type: string
        remittanceInformation:
          type: string
        settlementDate:
          type: string
          format: date
          description: The business day an ACH payment settles on.
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
    PaymentMessage:
      type: object
      required: [direction, type, body, at]
      properties:
        direction:
          type: string
          enum: [IN, OUT]
        type:
          type: string
          description: The ISO 20022 message name and version.
          examples: [pacs.008.001.08]
        body:
          type: string
          description: The message itself, as XML.
        at:
          type: string
          format: date-time
    PaymentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        nextCursor:
          type: string
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: A stable address for this kind of error.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: The path of the request that failed.
        code:
          type: string
          description: A stable code a client can branch on.
        fields:
          type: object
          description: For a body that failed validation, each bad field with what is wrong with it.
          additionalProperties:
            type: string
        traceId:
          type: string
          description: Quote this to support. It finds the request in the traces and the logs.
